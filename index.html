<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      interactive-widget=resizes-content keeps the layout above the native
      keyboard on Android; we mostly use our own keyboard but text inputs in
      the review screen still summon the system one.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#12151c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Grilles" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Photographie tes mots fléchés de magazine, digitalise-les et remplis-les partout, hors-ligne."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Grilles — mots fléchés</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Cette application a besoin de JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
